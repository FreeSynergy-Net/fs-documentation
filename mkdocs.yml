site_name: FreeSynergy
site_url: https://freesynergy.github.io/fs-documentation/
site_author: FreeSynergy Team
site_description: >-
  Software that follows you, not the other way round. Free, open, for everyone.

repo_name: FreeSynergy/fs-documentation
repo_url: https://github.com/FreeSynergy/fs-documentation
edit_uri: edit/main/docs/

# Theme: own colours (docs/assets/extra.css), no web font (system fonts only: no request to a third party).
theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - assets/extra.css

# Plugins. Top level of the menu is listed in `nav`, below it the menu follows the folders (awesome-pages);
# German and English are two folders, docs/en/ is the source (i18n).
plugins:
  - search
  - awesome-pages
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          nav_translations:
            1 Programs: Programs
            2 Interfaces: Interfaces
            3 Components: Components
            4 Interactions: Interactions
            5 Data standards: Data standards
            6 Manifesto: Manifesto
            7 Decisions: Decisions
            0 Get started: Get started
            8 Help: Help
        - locale: de
          name: Deutsch
          build: true
          site_name: FreeSynergy
          nav_translations:
            1 Programs: Programme
            2 Interfaces: Schnittstellen
            3 Components: Bausteine
            4 Interactions: Interaktionen
            5 Data standards: Datenstandards
            6 Manifesto: Manifest
            7 Decisions: Entscheidungen
            0 Get started: Loslegen
            8 Help: Hilfe
  # Old addresses of pages moved from programs/apps/history to programs/apps/activity (the program is named Activity now).
  # Every rename gets a line here (see the lesson in the umbenennen workflow).
  # English is the default language and sits at the site root (no "en/" prefix); German lives under /de/.
  # The plugin cannot compute a relative link to an English page (its target path still carries "en/"),
  # so the English targets are absolute URLs under site_url. Keep them in step with site_url.
  - redirects:
      redirect_maps:
        'de/programs/apps/history/index.md': 'de/programs/apps/activity/index.md'
        'programs/apps/history/index.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/'
        'programs/apps/history/requirements.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/requirements/'
        'programs/apps/history/frontends/index.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/'
        'programs/apps/history/frontends/activitywatch/index.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/activitywatch/'
        'programs/apps/history/frontends/activitywatch/latest/api.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/activitywatch/latest/api/'
        'programs/apps/history/frontends/activitywatch/latest/description.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/activitywatch/latest/description/'
        'programs/apps/history/frontends/activitywatch/latest/features.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/activitywatch/latest/features/'
        'programs/apps/history/frontends/activitywatch/latest/layout.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/activitywatch/latest/layout/'
        'programs/apps/history/frontends/activitywatch/latest/menus.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/activitywatch/latest/menus/'
        'programs/apps/history/frontends/activitywatch/latest/shortcuts.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/activitywatch/latest/shortcuts/'
        'programs/apps/history/frontends/day-one/index.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/day-one/'
        'programs/apps/history/frontends/day-one/latest/api.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/day-one/latest/api/'
        'programs/apps/history/frontends/day-one/latest/description.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/day-one/latest/description/'
        'programs/apps/history/frontends/day-one/latest/features.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/day-one/latest/features/'
        'programs/apps/history/frontends/day-one/latest/layout.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/day-one/latest/layout/'
        'programs/apps/history/frontends/day-one/latest/menus.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/day-one/latest/menus/'
        'programs/apps/history/frontends/day-one/latest/shortcuts.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/day-one/latest/shortcuts/'
        'programs/apps/history/frontends/exist-io/index.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/exist-io/'
        'programs/apps/history/frontends/exist-io/latest/api.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/exist-io/latest/api/'
        'programs/apps/history/frontends/exist-io/latest/description.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/exist-io/latest/description/'
        'programs/apps/history/frontends/exist-io/latest/features.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/exist-io/latest/features/'
        'programs/apps/history/frontends/exist-io/latest/layout.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/exist-io/latest/layout/'
        'programs/apps/history/frontends/exist-io/latest/menus.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/exist-io/latest/menus/'
        'programs/apps/history/frontends/exist-io/latest/shortcuts.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/activity/frontends/exist-io/latest/shortcuts/'
        # fs-groups moved from programs/platform/groups.md to programs/apps/groups/ (it has a window and a server).
        'de/programs/platform/groups.md': 'de/programs/apps/groups/index.md'
        'programs/platform/groups.md': 'https://freesynergy.github.io/fs-documentation/programs/apps/groups/'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Extra configuration
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FreeSynergy
      name: FreeSynergy on GitHub

docs_dir: docs
site_dir: site

copyright: |
  &copy; FreeSynergy &middot; <a href="https://github.com/FreeSynergy" target="_blank" rel="noopener">GitHub</a>

# Link checks. `mkdocs build --strict` turns every WARNING into an error, so what is "warn" here is a gate.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    anchors: warn
    # unrecognized_links: 2383 folder links ("dir/") that MkDocs never resolves; with the generated
    # folder indexes they all point to an existing index.md ("Did you mean ...") and work in the built site.
    # Rewrite them to "dir/index.md", then set to warn.
    unrecognized_links: info
