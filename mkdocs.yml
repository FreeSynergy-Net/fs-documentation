markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Extra configuration
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FreeSynergy
      name: FreeSynergy on GitHub

docs_dir: docs
site_dir: site

copyright: |
  &copy; FreeSynergy &middot; <a href="https://github.com/FreeSynergy" target="_blank" rel="noopener">GitHub</a>

# Link checks. `mkdocs build --strict` turns every WARNING into an error, so what is "warn" here is a gate.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    anchors: warn
    # unrecognized_links: 2383 folder links ("dir/") that MkDocs never resolves; with the generated
    # folder indexes they all point to an existing index.md ("Did you mean ...") and work in the built site.
    # Rewrite them to "dir/index.md", then set to warn.
    unrecognized_links: info
